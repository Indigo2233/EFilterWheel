; PlatformIO 配置文件 - 电动滤镜轮
; 支持 Arduino Nano (ATmega328P) 和 ESP8266 两种目标

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 57600
build_flags =
    -D PLATFORM_NANO
    -D F_CPU=16000000L
    -I firmware/common
lib_deps =
build_src_filter = +<../firmware/nano/> +<../firmware/common/>

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 57600
build_flags =
    -D PLATFORM_ESP8266
    -D F_CPU=80000000L
    -I firmware/common
lib_deps =
build_src_filter = +<../firmware/esp8266/> +<../firmware/common/>
